# Verify-only CI. This workflow NEVER pushes git refs and NEVER creates or
# uploads a GitHub Release: releases are cut from the maintainer's machine with
# `node scripts/release.cjs` (see AGENTS.md / ../rules/git.md). CI's job is to
# prove the committed tree, the generated registry and the vendored extension
# bundle are consistent — anything that writes git history fails review.
name: verify

on:
  push:
    branches: [main]
    tags: ['inspector-v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # publishedAt is the source commit date — needs history

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: registry drift (regenerate == committed)
        run: node scripts/publish-inspector.cjs

      - name: registry immutability
        run: node scripts/check-inspector-registry.cjs --immutable

      - name: registry determinism + publishedAt is the source commit date
        run: node scripts/check-inspector-registry.cjs --determinism

      - name: extension vendor drift
        run: node extension/tools/sync-vendor.mjs --check

      - name: protocol + artifact + site-bridge node suites
        run: |
          node --test --test-concurrency=1 inspector/test/protocol.test.js
          node --test test/artifact.test.js
          node --test test/extension-site-bridge.test.js

      - name: no binaries in git (dist/ is a Release asset, never a commit)
        run: |
          if git ls-files | grep -Ev '^$' | grep -E '\.(zip|tgz|tar\.gz|tar\.xz|run)$'; then
            echo '::error::binary release artifact found in git — release assets live on GitHub Releases'
            exit 1
          fi
          echo "no binary artifacts tracked"

      - name: no git-history version derivation in the release path
        run: |
          # Only the code that builds/ships: tests may legitimately mention the ban.
          if grep -rn 'rev-list' lib scripts inspector/src 2>/dev/null; then
            echo '::error::release-path code derives versions from git history'
            exit 1
          fi
          echo "versions are explicit"

  e2e:
    # INSP-002 — the shipped distribution end to end: the HTML embed on a plain
    # third-party page and the unpacked extension in a real Chromium. Hermetic
    # (test/e2e/live.spec.js is skipped unless HTML_INSPECTOR_LIVE=1, i.e. never
    # in CI). Still verify-only: no push, no release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: embed + extension e2e (hermetic)
        run: npx playwright test --project=e2e

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: inspector fixture-page suite (no dashboard process)
        run: npx playwright test --project=inspector
